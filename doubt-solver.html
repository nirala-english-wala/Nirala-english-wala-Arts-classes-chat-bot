<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nirala Doubt Solver</title>
<style>
  :root { --bg:#f7f8fc; --card:#fff; --text:#1c2033; --muted:#5b6178; --accent:#4f46e5; --user:#e0e7ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1220; --card:#181c30; --text:#eef0f8; --muted:#a3a9c2; --accent:#8b83ff; --user:#2a2f55; }
  }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; }
  header { padding:12px 16px; background:var(--card); border-bottom:1px solid rgba(128,128,160,.25); }
  header h1 { margin:0 0 8px; font-size:1.1rem; }
  select { width:100%; padding:8px; border-radius:8px; border:1px solid rgba(128,128,160,.4); background:var(--bg); color:var(--text); font-size:1rem; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.5; }
  .bot { background:var(--card); align-self:flex-start; border:1px solid rgba(128,128,160,.2); }
  .me { background:var(--user); align-self:flex-end; }
  form { display:flex; gap:8px; padding:12px; background:var(--card); border-top:1px solid rgba(128,128,160,.25); }
  textarea { flex:1; resize:none; padding:10px; border-radius:10px; border:1px solid rgba(128,128,160,.4); background:var(--bg); color:var(--text); font:inherit; max-height:120px; }
  button { padding:0 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; }
  button:disabled { opacity:.5; }
  .note { font-size:.8rem; color:var(--muted); text-align:center; padding:4px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>Nirala Doubt Solver</h1>
  <select id="subject">
    <option>English</option>
    <option>History</option>
    <option>Political Science</option>
    <option>Geography</option>
    <option>Hindi</option>
    <option>Other</option>
  </select>
</header>

<div id="chat">
  <div class="msg bot">Namaste! Main Nirala Doubt Solver hoon. Subject chuno aur apna doubt likho, main Hinglish mein samjhaunga.</div>
</div>
<div class="note">AI se galti ho sakti hai. Zaroori baatein apne sir se confirm kar lo.</div>

<form id="form">
  <textarea id="input" rows="1" placeholder="Apna doubt likho..." maxlength="1500"></textarea>
  <button id="send" type="submit">Bhejo</button>
</form>

<script>
  // Worker deploy karne ke baad yahan uska address daalo:
  const WORKER_URL = "https://YOUR-WORKER-NAME.YOUR-SUBDOMAIN.workers.dev";

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const subject = document.getElementById("subject");
  const history = [];

  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const q = input.value.trim();
    if (!q) return;
    input.value = "";
    add(q, "me");
    history.push({ role: "user", content: q });
    send.disabled = true;
    const wait = add("Soch raha hoon...", "bot");
    try {
      const res = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ subject: subject.value, messages: history }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error");
      wait.textContent = data.reply;
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      wait.textContent = "Abhi jawab nahi mil paya. Thodi der baad dobara try karo.";
      history.pop();
    }
    send.disabled = false;
    input.focus();
  });
</script>
</body>
</html>
